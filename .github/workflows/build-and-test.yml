name: Build and Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "SqlTest123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P SqlTest123! -C -Q 'SELECT 1' || /opt/mssql/bin/sqlcmd -S localhost -U sa -P SqlTest123! -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      MDS_TCPConnectionString: "Data Source=localhost;Initial Catalog=master;User Id=sa;Password=SqlTest123!;Encrypt=false;TrustServerCertificate=true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Build Microsoft.Data.SqlClient
        run: dotnet build src/Microsoft.Data.SqlClient/src/Microsoft.Data.SqlClient.csproj

      - name: Build unit tests
        run: dotnet build src/Microsoft.Data.SqlClient/tests/UnitTests/Microsoft.Data.SqlClient.UnitTests.csproj

      - name: Build manual tests
        run: dotnet build src/Microsoft.Data.SqlClient/tests/ManualTests/Microsoft.Data.SqlClient.ManualTests.csproj

      - name: Run unit tests
        run: dotnet test src/Microsoft.Data.SqlClient/tests/UnitTests/Microsoft.Data.SqlClient.UnitTests.csproj --no-build --verbosity normal --filter "FullyQualifiedName!~IntegratedAuthConnectionTest"

      - name: Run TransactionTest
        env:
          TEST_MDS_CONFIG: ${{ github.workspace }}/src/Microsoft.Data.SqlClient/tests/tools/Microsoft.Data.SqlClient.TestUtilities/config.jsonc
        run: dotnet test src/Microsoft.Data.SqlClient/tests/ManualTests/Microsoft.Data.SqlClient.ManualTests.csproj --no-build --verbosity normal --filter "FullyQualifiedName~ManualTesting.Tests.TransactionTest."
